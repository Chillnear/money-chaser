name: Paper Trading Daily

on:
  # ปิด schedule ไว้ก่อน (2026-08-03) — พบว่า workflow นี้เรียก src/main.py ตัวเดียวกับ daily.yml ซึ่งเป็น
  # ระบบเทรดจริง ถ้าปล่อยให้รันคู่กันวันละ 2 รอบ (07:20 + 22:00) จะเป็นการตัดสินใจเทรดจริงซ้อนกันโดยไม่ได้
  # ตั้งใจ นอกจากนี้ path/import ในไฟล์นี้ยังผิดอยู่ (cd money-chaser ที่ไม่มีจริง, python src/main.py ควร
  # เป็น python -m src.main) และทุก error ถูกซ่อนด้วย || true ทำให้ดูเหมือนผ่านตลอดถึงจะพังจริง — ต้องแก้
  # ให้ตรงจุดประสงค์เดิม (เทส grid_trader/funding_farmer แยกจาก src/main.py) ก่อนเปิด schedule กลับมาใหม่
  workflow_dispatch: {}  # กดรันมือได้เพื่อทดสอบ แต่ cron อัตโนมัติปิดไว้จนกว่าจะแก้ script ให้ถูกต้อง

jobs:
  paper_trading:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic numpy pandas PyYAML requests -q

      - name: Create state directory
        run: |
          mkdir -p state/journal

      - name: Run paper trading
        env:
          MODE: paper
        run: |
          cd money-chaser
          python src/main.py || true

      - name: Monitor results
        run: |
          cd money-chaser
          python scripts/monitor_paper_trading.py || true

      - name: Save results
        if: always()
        run: |
          cd money-chaser
          # Save daily results to git
          if [ -f state/daily_summary.json ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add state/journal/ state/daily_summary.json || true
            git commit -m "Paper trading: $(date +%Y-%m-%d)" || true
            git push || true
          fi

      - name: Create summary
        if: always()
        run: |
          cd money-chaser
          echo "✅ Paper Trading Run Complete" > /tmp/summary.txt
          if [ -f state/daily_summary.json ]; then
            cat state/daily_summary.json >> /tmp/summary.txt
          fi
          cat /tmp/summary.txt
